<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Protest+Riot">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Overlock">
    <style>
        body {
            font-family: Overlock, sans-serif;
            font-size: 32px;
        }

        #navbar {
            position: sticky;
            top: 0;
            overflow: hidden;
            z-index: 2;
        }

        #navbar a {
            float: left;
            display: block;
            text-align: center;
            padding: 1vw 1.5vw;
            text-decoration: none;
            font-size: 24px;
            transition: color 0.2s, background-color 0.2s;
        }

        .cardboard {
            position: relative;
            overflow: hidden;

            margin-left: 3vw;
            margin-right: 3vw;
            margin-top: 3vw;

            padding-inline: 6vw;
            padding-top: 3vw;
            padding-bottom: 3vw;

            border-radius: 2vw;

            img {
                opacity: 80%
            }
        }
        .cardboard::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image: url("cardboard.jpg");
            background-size: 100vw 100vw;
            background-repeat: repeat;

            z-index: 0;
        }
        .cardboard > * {
            position: relative;
            z-index: 1;
        }
        .cardboard .cardboard {
            margin-bottom: 2vw;
        }

        h1 {
            font-family: "Protest Riot", cursive;
            font-size: 56px;
            text-align: center;
        }
        h2 {
            font-family: "Protest Riot", cursive;
            font-size: 40px;
            text-align: center;
        }
    </style>
    <style>
        body {
        background-color: #cabbff;
        color: black;
        a {
            color: rgb(17 52 167)
        }
        a:hover {
            color: rgb(65 102 200)
        }
    }

    #navbar {
        background-color: #8c76da;
        border-bottom: 0.4vw solid #000000;
        box-shadow: 0 -10vw 0 10vw #8c76da, 0 0.1vw 0.5vw 0.5vw rgb(24 20 94 / 0.32);
    }

    #navbar a {
        color: #000000;
    }

    #navbar a:hover {
        background-color: #c7c0f2;
        color: black;
    }

    .cardboard {
        box-shadow: 0 1vw 0 0 #825c4d, 0 1.25vw 0.5vw 0.5vw rgb(2 3 45 / 0.25);
    }
    .cardboard::before {
        background-color: #cea98a;
    }
    .cardboard .cardboard {
        box-shadow: 0 1vw 0 0 #825c4d, 0 1.25vw 1.5vw 1vw rgb(2 3 45 / 0.25);
    }

    h1 {
        color: rgb(6 0 29);
    }

    h2 {
        color: rgb(6 0 29);
    }

    p {
        color: rgb(6 0 29);
    }</style>

    <title>error 404</title>
</head>

<body>

<div id='navbar'>
    <a class='link' href='https://landmine.maykids.org/index.html?dark=false'>Home</a>
    <a class='link' href='https://landmine.maykids.org/portfolio.html?dark=false'>portfolio</a>
    <a class='link' href='https://landmine.maykids.org/personalProjects/projectList.html?dark=false'>projects</a>
    <a class='link' href='https://landmine.maykids.org/musings/directory.html?dark=false'>musings</a>
    <a class='link' href='https://landmine.maykids.org/sideTracks.html?dark=false'>collection</a>
</div>

<div class='cardboard'>
    <h1>404 Not Found</h1>
    <p>Sorry, there has been some kind of error, most likely a mistyped url or a non-existent page.</p>
</div>

</body>

</html>
