<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cardboard</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Protest+Riot">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Overlock">
    <link rel="stylesheet" href="cardboard.css" id="light">
    <link rel="stylesheet" href="cardboardDark.css" id="dark" disabled>

    <script>
        function header(relative) {
            if (relative === undefined) {
                relative = '';
            }
            let header = "<div id='navbar'> <a href='";
            header += relative;
            header += "index.html'>Home</a> <a href='";
            header += relative;
            header += "portfolio.html'>portfolio</a> <a href='";
            header += relative;
            header += "personalProjects/projectList.html'>projects</a> <a href='";
            header += relative;
            header += "musings/directory.html'>musings</a> <a href='";
            header += relative;
            header += "about.html'>about</a> <a href='' onclick='mode()' id='mode'>☽ dark</a> </div>";
            document.getElementById('navbar').innerHTML = header;
        }

        function param() {
            const url = new URL(window.location.href);
            const dark = url.searchParams.get("dark");

            if (dark === "true") {
                document.getElementById("light").disabled = true;
                document.getElementById("dark").disabled = false;
                document.getElementById("mode").innerText = 'light mode';
            } else {
                document.getElementById("dark").disabled = true;
                document.getElementById("light").disabled = false;
                document.getElementById("mode").innerText = 'dark mode';
            }
        }

        function mode() {
            const url = new URL(window.location.href);
            const params = url.searchParams;

            const dark = params.get("dark");
            params.set("dark", dark === "true" ? "false" : "true");

            history.pushState({}, "", url);
            param();
        }
    </script>

</head>

<body onload="header(''); param();">
<div id='navbar'></div>

<div class='cardboard'>
    <img src="banner.png" alt="a banner showing off some of my interests" style="width:100%;">
</div>

<div class="cardboard">

        <li><a href="graphicDesign/designPortfolio.html">graphic design portfolio</a></li>
        <li><a href="gameDev/gamePortfolio.html">game dev portfolio</a></li>
        <li><a href="personalProjects/projectList.html">personal projects</a></li>
        <li><a href="musings/directory.html">musings</a></li>
        <li><a href="about.html">about</a></li>
        <li><a href="sideTracks.html">random stuff I find neat</a></li>
    </ul>
</div>

<br/><br/>

</body>
</html>
