<html lang="English">

<head>

    <meta charset="UTF-8">

    <style>
        body {
            font-family: 'Trebuchet MS', sans-serif;
            background-color: beige;
            color: #05095a;

            h1 {
                font-size: 4vmin;
            }

            font-size: 2vmin;

            hr {
                border: 0.5vmin solid #05095a;
            }

            a:link {
                color: #0056af;
                text-decoration: none;
            }

            a:visited {
                color: #0056af;
                text-decoration: none;
            }

            a:hover {
                color: #008ed6;
                text-decoration: underline;
            }

            a:active {
                color: #008ed6;
                text-decoration: underline;
            }

            .centered {
                display: flex;
                justify-content: center;
                text-align: center;
            }
        }
    </style>
    <style>
        .container{
            position: absolute;
        }

        .container .selection {
            width: 2vw;
            height: 1.5vw;
            transition: 0.2s;
            border-radius: 0.5vw;
            position: absolute;
            cursor: pointer;
        }
        .container .photo {
            width: 1.5vw;
            transition: opacity 0.2s, top 0.2s, transform 0.2s, border 0.1s, z-index 0.2s, filter 0.15s;
            border-radius: 0.5vw;
            transform: scale(1);
            position: absolute;
            pointer-events: none;
            z-index: 1;
            border-style: solid;
            border-width: 0.2vw;
            border-color: black;
            filter: grayscale(30%) contrast(70%) brightness(130%) blur(0.03vw);
        }
        .container .selection:hover + .photo {
            transform: scale(8);
            border-radius: 0.1vw;
            z-index: 4;
            border-width: 0.05vw;
            cursor: pointer;
            filter: grayscale(0) contrast(100%) brightness(100%) blur(0);
        }


        .screenDarken {
            position: fixed;
            z-index: 5;
            padding-top: 1px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .modal {
            transition: opacity 0.3s, top 0.4s;
            z-index: 6;
            pointer-events: none;
        }
        .modal-content {
            background-color: beige;
            padding: 2vw;
            border: 0.5vw solid black;
            border-top: none;
            width: 80%;
            border-bottom-right-radius: 1vw;
            border-bottom-left-radius: 1vw;
            box-shadow: 0 2vw 3vw rgba(7,7,46,0.35);
        }

        .close {
            color: grey;
            float: right;
            font-size: 28px;
            font-weight: bold;
            transition: 0.2s;
        }

        .close:hover,
        .close:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
    </style>

    <title>mural map</title>

</head>

<script>
    var modal = document.getElementById("myModal");
    var span = document.getElementById("close");
    var content = document.getElementById("content");
    var image = document.getElementById("image");
    var screenDarken = document.getElementById("screenDarken");

    function modalScript(text, photo) {
        modal.style.opacity = "1";
        screenDarken.style.opacity = "1";
        screenDarken.style.pointerEvents = "auto";
        modal.style.pointerEvents = "auto";
        modal.style.top = "0";

        content.innerText = text;
        image.src = photo;
    }
    function modalClose() {
        modal.style.opacity = "0";
        screenDarken.style.opacity = "0";
        screenDarken.style.pointerEvents = "none";
        modal.style.pointerEvents = "none";
        modal.style.top = "-8vw";
    }

</script>
