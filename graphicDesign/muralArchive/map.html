    <!-- Basic page styling -->
    <style>
        body {
            font-family: 'Trebuchet MS', sans-serif;
            background-color: beige;
            color: #05095a;

            h1 {
                font-size: 3vw;
            }

            font-size: 1vw;

            hr {
                border: 0.5vw solid #05095a;
            }

            a:link {
                color: #0056af;
                text-decoration: none;
            }

            a:visited {
                color: #0056af;
                text-decoration: none;
            }

            a:hover {
                color: #008ed6;
                text-decoration: underline;
            }

            a:active {
                color: #008ed6;
                text-decoration: underline;
            }
        }
    </style>

    <style>
        /* Map Icon parent object styling */
        .container{
            position: absolute;
            -webkit-user-select:none; user-select:none;
        }

        /* Image hover detection box styling */
        .container .selection {
            width: 1.8vw;
            height: 1.3vw;
            transition: 0.2s;
            border-radius: 0.5vw;
            position: absolute;
            cursor: pointer;
        }

        /* Image map icon styling  */
        .container .photo {
            width: 1.5vw;
            transition: opacity 0.2s, top 0.2s, transform 0.2s, border 0.1s, z-index 0.2s, filter 0.15s;
            border-radius: 0.5vw;
            transform: scale(1);
            position: absolute;
            pointer-events: none;
            z-index: 1;
            border-style: solid;
            border-width: 0.2vw;
            border-color: black;
            background-color: rgba(0, 0, 0, 0.48);
        }

        /* Image hover expanding css */
        .container .selection:hover + .photo {
            transform: scale(8);
            border-radius: 0.1vw;
            z-index: 4;
            border-width: 0.05vw;
            cursor: pointer;
        }

        /* screen darken object styling  */
        .screenDarken {
            position: fixed;
            z-index: 5;
            padding-top: 1px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            transition: opacity 0.4s;
            pointer-events: none;
        }

        /* Modal styling (box that opens when you click an image) */
        .modal {
            transition: opacity 0.3s, top 0.4s;
            z-index: 6;
            pointer-events: none;
        }
        .modal-content {
            background-color: beige;
            padding: 2vw;
            border: 0.5vw solid black;
            border-top: none;
            width: 80%;
            border-bottom-right-radius: 1vw;
            border-bottom-left-radius: 1vw;
            box-shadow: 0 2vw 3vw rgba(7,7,46,0.35);
        }

        /* modal close button  */
        .close {
            color: grey;
            float: right;
            font-size: 5vmax;
            font-weight: bold;
            transition: 0.2s;
        }
        .close:hover,
        .close:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
    </style>

    <!-- Loading Icon styling and animation -->
    <style>
        .loader {
            width: 10vw;
            padding: 2vw;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #ffffff;
            --_m:
                    conic-gradient(#0000 20%,#000),
                    linear-gradient(#000 0 0) content-box;
            -webkit-mask: var(--_m);
            mask: var(--_m);
            -webkit-mask-composite: source-out;
            mask-composite: subtract;
            animation: l3 1s infinite linear;
        }
        @keyframes l3 {to{transform: rotate(1turn)}}
    </style>

    <title>mural map</title>

</head>

<script>

    // object refrence variables
    let modal = document.getElementById("myModal");
    let span = document.getElementById("close");
    let content = document.getElementById("content");
    let image = document.getElementById("image");
    let screenDarken = document.getElementById("screenDarken");
    let redirect = document.getElementById("redirect");
    let caption = document.getElementById("caption");
    let loader = document.getElementById("loader");
    let loading = true;

    // function to set modal content according to which mural icon is clicked
    function modalScript(text, photo, extra, link, linkText) {
        modal.style.opacity = "1";
        screenDarken.style.opacity = "1";
        screenDarken.style.pointerEvents = "auto";
        modal.style.pointerEvents = "auto";
        modal.style.top = "0";

        content.innerText = text;
        image.src = photo;
        if (link.length > 0 && linkText.length > 0) {
            redirect.href = link;
            redirect.innerText = linkText;
        }
        if (extra.length > 0) {
            caption.innerText = extra;
        }
    }

    // function to close info box window after the close button or darken objects are clicked
    function modalClose() {
        if (!loading) {
            modal.style.opacity = "0";
            screenDarken.style.opacity = "0";
            screenDarken.style.pointerEvents = "none";
            modal.style.pointerEvents = "none";
            redirect.href = '';
            redirect.innerText = '';
            caption.innerText = '';
            image.src = 'images/blank.png';
        }
    }

    // function called after the page is finished loading, hides the loading icon, and hides background darken
    function hideLoader() {
        loading = false;
        loader.style.display = 'none';
        screenDarken.style.opacity = "0";
        screenDarken.style.pointerEvents = "none";
    }

</script>
