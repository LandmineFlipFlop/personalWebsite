    <style>
        .container{
            position: absolute;
        }

        .container .selection {
            width: 1.5vw;
            height: 1.5vw;
            transition: 0.2s;
            border-radius: 0.5vw;
            position: absolute;
            cursor: pointer;
        }
        .container .photo {
            width: 1.5vw;
            transition: 0.2s;
            border-radius: 0.5vw;
            transform: scale(1);
            position: absolute;
            pointer-events: none;
            z-index: 1;
            border-style: solid;
            border-width: 0.2vw;
            border-color: black;
        }
        .container .selection:hover + .photo {
            transform: scale(8);
            border-radius: 0.1vw;
            z-index: 99;
            border-width: 0.05vw;
            cursor: pointer;
        }


        .screenDarken {
            position: fixed;
            z-index: 100;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .modal {
            transition: 0.4s;
            z-index: 101;
        }
        .modal-content {
            background-color: beige;
            padding: 2vw;
            border: 0.5vw solid black;
            border-top: none;
            width: 80%;
            border-bottom-right-radius: 1vw;
            border-bottom-left-radius: 1vw;
            box-shadow: 0 2vw 3vw rgba(7,7,46,0.35);
        }

        .close {
            color: grey;
            float: right;
            font-size: 28px;
            font-weight: bold;
            transition: 0.2s;
        }

        .close:hover,
        .close:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
    </style>

<script>
    var modal = document.getElementById("myModal");
    var span = document.getElementsByClassName("close")[0];
    var content = document.getElementById("content");
    var image = document.getElementById("image");
    var screenDarken = document.getElementById("screenDarken");

    function modalScript(text, photo) {
        modal.style.opacity = "1";
        modal.style.top = "0";
        content.innerText = text;
        image.src = photo;
        screenDarken.style.opacity = "1";
    }
    function modalClose() {
        modal.style.opacity = "0";
        modal.style.top = "-8vw";
        screenDarken.style.opacity = "0";
    }
